# Link checker config: https://lychee.cli.rs/guides/config/
# Run with `just lychee` (offline) or `just lychee-online`.
# Callers pass --include-fragments: its config type differs between lychee 0.23 and 0.24.
extensions = ["md"]
exclude_loopback = true
no_progress = true
exclude_path = ["\\.venv", "\\.terraform"]

# Some vendor sites rate-limit link checkers; a 429 means the page exists.
accept = ["200..=299", "429"]
max_retries = 3
