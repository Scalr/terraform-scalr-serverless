name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - run: uv sync --frozen
      # The links job runs lychee online, which covers the offline hook.
      - run: uv run --frozen prek run --all-files --show-diff-on-failure
        env:
          SKIP: lychee
      - run: uv run --frozen pytest

  validate:
    name: Validate and test ${{ matrix.root }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [aws, azure]
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - run: tofu init -backend=false -input=false
        working-directory: ${{ matrix.root }}
      - run: tofu validate
        working-directory: ${{ matrix.root }}
      - run: tofu test
        working-directory: ${{ matrix.root }}

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --include-fragments .
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
