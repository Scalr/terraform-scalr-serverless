[project]
name = "terraform-scalr-serverless"
version = "0.1.0"
description = "Terraform and OpenTofu modules for Scalr serverless agent pools"
readme = "README.md"
# Matches the default Lambda runtime (var.lambda_runtime = python3.11).
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.43.125",
    "prek>=0.5.10",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.98",
    "types-boto3[ecs]>=1.43.124",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["lambda_function"]

[tool.ty.environment]
python-version = "3.11"
# The Lambda handler is a single file, imported by the tests as a top-level module.
extra-paths = ["aws"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["aws"]
addopts = ["--strict-markers"]
